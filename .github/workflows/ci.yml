name: Portal checks
on:
  pull_request:
    branches: [next]
  push:
    branches: [next]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.7-bookworm@sha256:86e0b703649d7a792bd9243ee28afc9d8f7c6b2b5638077c9d6882d4d472bbfd
        env:
          POSTGRES_DB: portal_ci
          POSTGRES_USER: portal_ci
          POSTGRES_PASSWORD: ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U portal_ci -d portal_ci"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.17'
      - run: python -m pip install --require-hashes -r requirements.txt
      - run: pip install pip-audit==2.10.1
      - run: pip-audit -r requirements.txt
      - run: python manage.py check --settings=portal.settings_test
      - run: python manage.py test tests --settings=portal.settings_test --noinput
      - run: python manage.py test tests --settings=portal.settings_ci_postgres --noinput
      - run: python manage.py makemigrations --check --dry-run --settings=portal.settings_test
      - run: docker build --tag portal:0.1.0-dev .
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - run: ./scripts/secret-scan.sh
