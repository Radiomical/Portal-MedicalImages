{% if page_obj.paginator.num_pages > 1 %}<nav class="pagination" aria-label="Páginas de entradas">{% if page_obj.has_previous %}<a href="?page={{ page_obj.previous_page_number }}{% if query %}&amp;q={{ query|urlencode }}{% endif %}">← Página anterior</a>{% endif %}<span>Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span>{% if page_obj.has_next %}<a href="?page={{ page_obj.next_page_number }}{% if query %}&amp;q={{ query|urlencode }}{% endif %}">Página siguiente →</a>{% endif %}</nav>{% endif %}
